[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/midub/boardui"

[workspace.dependencies]
boardui-convert = { path = "crates/boardui-convert", version = "0.1.0" }
boardui-geom = { path = "crates/boardui-geom", version = "0.1.0" }
boardui-gltf = { path = "crates/boardui-gltf", version = "0.1.0" }
boardui-ipc2581 = { path = "crates/boardui-ipc2581", version = "0.1.0" }
wasm-bindgen = "0.2.129"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
