name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml (incl. the wasm32 target).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p boardui-wasm --target wasm32-unknown-unknown --release --locked

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Converts every sample in spec/samples, checks it with the profile validator and
      # compares it with spec/samples/expected.
      - name: Convert and validate the samples
        run: cargo test -p boardui-convert --test conformance --locked
        env:
          BOARDUI_CONFORMANCE_OUT: target/conformance
      - name: boardui validate
        run: |
          cargo build -p boardui --locked
          for glb in target/conformance/*.glb; do ./target/debug/boardui validate --no-khronos "$glb"; done
      - name: Khronos glTF validator
        run: |
          mkdir -p target/khronos
          echo '{"private": true}' > target/khronos/package.json
          npm install --prefix target/khronos --no-audit --no-fund gltf-validator@2.0.0-dev.3.10
          node scripts/khronos-validate.mjs target/khronos target/conformance/*.glb

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Rust, wasm-bindgen, wasm-opt, pnpm, Node, `pnpm install` (shared with pages.yml).
      - uses: ./.github/actions/setup-web
      - run: pnpm lint
      # Also checks that the demos' dist/ contain no IPC consortium test data.
      - run: pnpm build
      - run: pnpm test
      # The Pages site (site/: every demo app and the redirect of /boardui/), as pages.yml deploys
      # it, checked again for IPC consortium test data.
      - run: pnpm site
      - uses: actions/upload-artifact@v7
        with:
          name: demo-site
          # The site, and the e2e suite's static server (packages/demo-shared/dist/build).
          path: |
            site
            packages/demo-shared/dist
          retention-days: 3

  e2e:
    name: Demos (Playwright)
    needs: web
    runs-on: ubuntu-latest
    # The screenshots in packages/demo-shared/e2e/*-snapshots are made in this image.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: demo-site
          path: .
      # For every demo app (a Playwright project each): converts every sample in the browser
      # (WASM in a worker), plus smoke and screenshot tests, in Chromium with software rendering;
      # and the redirect of /boardui/. The site is served as GitHub Pages serves it.
      - run: pnpm e2e
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: packages/demo-shared/test-results
          retention-days: 7
