name: Pages

# Builds the demos and deploys them to GitHub Pages, https://midub.github.io/boardui/: each demo app
# at /boardui/<id>/ (packages/demo-react at /boardui/react/, packages/demo-angular at
# /boardui/angular/), and /boardui/, which redirects to react/ keeping the query and hash. The apps
# are the ones in DEMOS (packages/demo-shared/src/frameworks.ts).
# Pull requests that change this workflow, the shared setup or the site builder only build it.
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - .github/actions/setup-web/**
      - packages/demo-shared/src/build/site.ts
      - packages/demo-shared/src/frameworks.ts
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling a deployment in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same setup as the CI Web job, which tests the build on every pull request.
      - uses: ./.github/actions/setup-web
      # Also checks that the demos' dist/ contain no IPC consortium test data.
      - run: pnpm build
      # site/: site/<id>/ for every demo app (packages/demo-<id>/dist), and site/index.html, the
      # redirect; checked again for IPC consortium test data.
      - run: pnpm site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
