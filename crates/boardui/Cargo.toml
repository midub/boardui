[package]
name = "boardui"
description = "Command-line tool: convert IPC-2581 to boardui glTF and validate boardui assets."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "boardui"
path = "src/main.rs"

[dependencies]
boardui-convert.workspace = true
boardui-ipc2581.workspace = true
clap = { version = "4.5.51", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
serde_json = "1.0.145"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

[lints]
workspace = true
